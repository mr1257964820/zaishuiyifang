<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>在水一方 — 京北山地天然食材服务体系</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;700;900&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'on-secondary-fixed': '#1b1c1b',
            'on-tertiary-container': '#eacaa0',
            'background': '#fbf9f4',
            'on-background': '#1b1c19',
            'on-secondary-fixed-variant': '#474746',
            'secondary-fixed-dim': '#c8c6c4',
            'on-surface-variant': '#434843',
            'on-primary': '#ffffff',
            'on-primary-fixed': '#0e1f13',
            'on-tertiary-fixed': '#291800',
            'surface-variant': '#e4e2dd',
            'secondary-fixed': '#e4e2e0',
            'primary-fixed': '#d3e8d5',
            'on-error-container': '#93000a',
            'on-error': '#ffffff',
            'inverse-on-surface': '#f2f1ec',
            'surface-dim': '#dbdad5',
            'on-surface': '#1b1c19',
            'on-tertiary-fixed-variant': '#594323',
            'on-tertiary': '#ffffff',
            'surface': '#fbf9f4',
            'tertiary': '#523d1e',
            'on-primary-container': '#c0d5c2',
            'on-secondary-container': '#656463',
            'secondary': '#5f5e5d',
            'outline': '#737872',
            'primary-container': '#4a5d4e',
            'surface-container-highest': '#e4e2dd',
            'on-primary-fixed-variant': '#394b3d',
            'surface-tint': '#506354',
            'outline-variant': '#c3c8c1',
            'primary': '#334537',
            'surface-container-high': '#eae8e3',
            'primary-fixed-dim': '#b7ccb9',
            'inverse-primary': '#b7ccb9',
            'surface-container-low': '#f5f3ee',
            'on-secondary': '#ffffff',
            'tertiary-fixed': '#ffddb2',
            'surface-bright': '#fbf9f4',
            'secondary-container': '#e4e2e0',
            'error': '#ba1a1a',
            'surface-container-lowest': '#ffffff',
            'inverse-surface': '#30312e',
            'tertiary-container': '#6c5433',
            'tertiary-fixed-dim': '#e1c298',
            'surface-container': '#f0eee9',
            'error-container': '#ffdad6',
          },
          borderRadius: {
            DEFAULT: '0px',
            lg: '0px',
            xl: '0px',
            full: '9999px',
          },
          fontFamily: {
            headline: ['Noto Serif SC', 'serif'],
            body: ['Manrope', 'sans-serif'],
            label: ['Manrope', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <style>
    /* ── Base ─────────────────────────────────────────────── */
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
    }
    html {
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }
    body {
      font-family: 'Manrope', sans-serif;
      background-color: #fbf9f4;
      color: #1b1c19;
      cursor: none; /* 隐藏默认光标，使用自定义光标 */
      overflow-x: hidden;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (pointer: coarse) { body { cursor: auto; } }
    a, button, [role="button"] { touch-action: manipulation; }
    h1, h2, h3, .serif, .serif-display, .serif-title {
      font-family: 'Noto Serif SC', serif;
    }
    .mask-gradient {
      mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* ── 页面切换 ─────────────────────────────────────────── */
    .page-enter-active {
      transition: opacity 0.55s cubic-bezier(0.16,1,0.3,1), transform 0.55s cubic-bezier(0.16,1,0.3,1);
    }
    .page-leave-active {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .page-enter-from { opacity: 0; transform: translateY(20px); }
    .page-leave-to  { opacity: 0; transform: translateY(-12px); }

    /* ── 移动端菜单 ───────────────────────────────────────── */
    .menu-enter-active, .menu-leave-active {
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .menu-enter-from, .menu-leave-to { opacity: 0; transform: translateY(-8px); }

    /* ── 自定义光标 ───────────────────────────────────────── */
    #site-cursor { pointer-events: none; position: fixed; inset: 0; z-index: 9999; }
    .cursor-dot {
      position: absolute; top: -3px; left: -3px;
      width: 6px; height: 6px;
      background: #334537;
      border-radius: 50%;
      transition: opacity 0.2s;
      will-change: transform;
    }
    .cursor-ring {
      position: absolute; top: -18px; left: -18px;
      width: 36px; height: 36px;
      border: 1px solid #334537;
      border-radius: 50%;
      opacity: 0.5;
      transition: width 0.35s cubic-bezier(0.16,1,0.3,1),
                  height 0.35s cubic-bezier(0.16,1,0.3,1),
                  top 0.35s cubic-bezier(0.16,1,0.3,1),
                  left 0.35s cubic-bezier(0.16,1,0.3,1),
                  opacity 0.35s ease,
                  background 0.35s ease;
      will-change: transform;
    }
    .cursor-ring.is-hover {
      width: 56px; height: 56px;
      top: -28px; left: -28px;
      opacity: 0.25;
      background: rgba(51,69,55,0.08);
    }
    .cursor-ring.is-click {
      width: 24px; height: 24px;
      top: -12px; left: -12px;
      opacity: 0.7;
    }

    /* ── Navbar 滚动态 ────────────────────────────────────── */
    nav { transition: padding 0.4s ease, background 0.4s ease, box-shadow 0.4s ease; }
    nav.nav-scrolled {
      padding-top: 1rem !important;
      padding-bottom: 1rem !important;
      background: rgba(251,249,244,0.92) !important;
      box-shadow: 0 1px 0 rgba(27,28,25,0.06);
    }

    /* ── Scroll Reveal ────────────────────────────────────── */
    .reveal-init { opacity: 0; }
    .reveal-up    { transform: translateY(40px); }
    .reveal-left  { transform: translateX(-40px); }
    .reveal-right { transform: translateX(40px); }
    .reveal-scale { transform: scale(0.93); }
    @media (max-width: 639px) {
      .reveal-up    { transform: translateY(24px); }
      .reveal-left  { transform: translateX(-20px); }
      .reveal-right { transform: translateX(20px); }
    }

    .reveal-init.is-visible {
      opacity: 1 !important;
      transform: none !important;
      transition: opacity 0.75s cubic-bezier(0.16,1,0.3,1),
                  transform 0.75s cubic-bezier(0.16,1,0.3,1);
    }

    /* ── Image clip-path reveal ───────────────────────────── */
    .img-reveal-init {
      clip-path: inset(0 100% 0 0);
      transition: clip-path 1.1s cubic-bezier(0.16,1,0.3,1);
    }
    .img-reveal-init.img-revealed {
      clip-path: inset(0 0% 0 0);
    }

    /* ── 数字光晕 ─────────────────────────────────────────── */
    [data-count] {
      display: inline-block;
    }

    /* ── 视差容器 ─────────────────────────────────────────── */
    [data-parallax] {
      will-change: transform;
      transition: none;
    }

    /* Stagger 由 animations.js 中的 setTimeout 控制，CSS 无需重复延迟 */
  </style>
</head>
<body class="text-on-surface selection:bg-primary-container selection:text-on-primary-container">

  <div id="app"></div>

  <!-- Vue 3 & Vue Router 4 (Global CDN builds — no ES modules, works with file://) -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>

  <!-- Components (load order matters) -->
  <script src="src/components/navbar.js"></script>
  <script src="src/components/site-footer.js"></script>

  <!-- Pages -->
  <script src="src/pages/home-page.js"></script>
  <script src="src/pages/service-page.js"></script>
  <script src="src/pages/origin-page.js"></script>
  <script src="src/pages/about-page.js"></script>

  <!-- Router + App mount -->
  <script src="src/app.js"></script>

  <!-- 高级动画系统（最后加载，DOM 就绪后自动初始化） -->
  <script src="src/animations.js"></script>
</body>
</html>
